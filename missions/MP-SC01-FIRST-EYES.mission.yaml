schema: mission-pack/1
id: MP-SC01-FIRST-EYES
extends: { table: scenarios, id: SC-01 }      # ke thua ngan sach, diem toi thieu, tuoi tho, han, quy dao cho phep
meta:
  title: { vi: "Đôi mắt đầu tiên nhìn Trái Đất", en: "First Eyes on Earth" }
  brief: { vi: "Đưa một CubeSat lên quỹ đạo thấp để chụp ảnh Trái Đất trong ngân sách nhỏ.", en: "Put a CubeSat in low orbit to photograph Earth on a small budget." }
  learning_goals: [ "power budget", "data downlink" ]
  difficulty: 1
objective:
  statement: { vi: "Chụp ảnh và hạ được dữ liệu về trạm mặt đất.", en: "Capture images and downlink them to a ground station." }
design_space:
  allow: { instruments: { tier: [ basic ] } }
constraints:
  - { id: data, critical: true }
starter: fail_data
gameplay: { mode: auto, params: { target_set: coast } }
hazards: { profile: standard, seed: 42 }
presets:
  - id: good
    expect: pass
    design:
      orbit: ORB-LEO-400
      instruments: [ INS-01 ]
      bus: BUS-3U
      power: PWR-SA-DEP
      battery: BAT-S
      comm: COM-S-CUBE
      obc: OBC-CUBE
      adcs: ADCS-WHEEL
      launch: { vehicle: LV-ELECTRON, site: SITE-MAHIA }
  - id: fail_data
    from: good
    swap: { comm: COM-UHF }
    expect: "fail:data"
  - id: fail_power
    from: good
    swap: { power: PWR-SA-BODY }
    expect: "fail:power"
  - id: fail_pointing
    from: good
    swap: { adcs: ADCS-MAG }
    expect: "fault:blur"
