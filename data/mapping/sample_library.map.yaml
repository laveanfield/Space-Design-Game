# Mapping cho data/raw/sample_library.json (DU LIEU MAU). Ngay thi: viet mapping cho dataset that.
# Moi muc trong `tables` = mot bang. Co the tach thanh nhieu file *.map.yaml. unit = don vi cua COT NGUON.
tables:
  - table: scenarios
    source: { file: sample_library.json, sheet: Scenarios }
    id: { from: "Scenario ID", expect_prefix: "SC-" }
    fields:
      name: { from: "Name" }
      mission_type: { from: "Mission Type" }
      budget_musd: { from: "Budget (M$)", unit: MUSD }
      min_science_pts: { from: "Min Science (pts)" }
      min_mission_life_years: { from: "Min Life (years)" }
      deadline_months: { from: "Deadline (months)" }
      allowed_orbit_ids: { from: "Allowed Orbits", split: ";" }
      learning_goal: { from: "Learning Goal" }

  - table: orbits
    source: { file: sample_library.json, sheet: Orbits }
    id: { from: "Orbit ID", expect_prefix: "ORB-" }
    fields:
      name: { from: "Name" }
      class: { from: "Class" }
      altitude_km: { from: "Altitude (km)", unit: km }
      inclination_deg: { from: "Inclination (deg)", unit: deg }
      eclipse_fraction: { from: "Eclipse Fraction" }
      ground_contact_min_per_day: { from: "Ground Contact (min/day)" }
      radiation_dose_krad_per_year: { from: "Radiation (krad/yr)" }
      orbital_lifetime_years_no_reboost: { from: "Lifetime No Reboost (yr)" }
      lv_payload_factor: { from: "LV Payload Factor" }
      description_simple: { from: "Description" }

  - table: instruments
    source: { file: sample_library.json, sheet: Instruments }
    id: { from: "Instrument ID", expect_prefix: "INS-" }
    fields:
      name: { from: "Name" }
      tier: { from: "Tier" }
      science_value_pts: { from: "Science Value (pts)" }
      mass_kg: { from: "Mass (kg)", unit: kg }
      power_operating_w: { from: "Operating Power (W)", unit: W }
      data_generated_gb_per_day: { from: "Data (GB/day)", unit: GB/day }
      pointing_required_deg: { from: "Pointing (deg)", unit: deg }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }
      compatible_orbit_ids: { from: "Compatible Orbits", split: ";" }
    defaults: { tier: basic }

  - table: buses
    source: { file: sample_library.json, sheet: Buses }
    id: { from: "Bus ID", expect_prefix: "BUS-" }
    fields:
      name: { from: "Name" }
      class: { from: "Class" }
      mass_kg: { from: "Structure Mass (kg)", unit: kg }
      max_total_mass_kg: { from: "Max Total Mass (kg)", unit: kg }
      size_m: { from: "Size (m)", unit: m }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }

  - table: power_arrays
    source: { file: sample_library.json, sheet: Power Arrays }
    id: { from: "Power ID", expect_prefix: "PWR-" }
    fields:
      name: { from: "Name" }
      kind: { from: "Kind" }
      generation_w: { from: "Generation (W)", unit: W }
      mass_kg: { from: "Mass (g)", unit: g }          # cot nguon tinh bang gam -> doi sang kg
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }

  - table: batteries
    source: { file: sample_library.json, sheet: Batteries }
    id: { from: "Battery ID", expect_prefix: "BAT-" }
    fields:
      name: { from: "Name" }
      capacity_wh: { from: "Capacity (Wh)", unit: Wh }
      mass_kg: { from: "Mass (g)", unit: g }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }

  - table: comms
    source: { file: sample_library.json, sheet: Comms }
    id: { from: "Comm ID", expect_prefix: "COM-" }
    fields:
      name: { from: "Name" }
      band: { from: "Band" }
      antenna_gain_dbi: { from: "Gain (dBi)" }
      tx_power_w: { from: "Tx Power (W)", unit: W }
      downlink_mbps: { from: "Downlink (Mbps)", unit: Mbps }
      pointing_required_deg: { from: "Pointing Required (deg)", unit: deg }
      max_range_km: { from: "Max Range (km)", unit: km }
      mass_kg: { from: "Mass (kg)", unit: kg }
      power_w: { from: "Power (W)", unit: W }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }

  - table: avionics
    source: { file: sample_library.json, sheet: Avionics }
    id: { from: "Avionics ID" }
    fields:
      name: { from: "Name" }
      type: { from: "Type" }
      rad_tolerance_krad: { from: "Rad Tolerance (krad)", unit: krad }
      pointing_accuracy_deg: { from: "Pointing Accuracy (deg)", unit: deg }
      torque_nm: { from: "Torque (mN*m)", unit: mNm }
      mass_kg: { from: "Mass (kg)", unit: kg }
      power_w: { from: "Power (W)", unit: W }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      lead_time_months: { from: "Lead Time (months)" }

  - table: launch_vehicles
    source: { file: sample_library.json, sheet: Launch Vehicles }
    id: { from: "LV ID", expect_prefix: "LV-" }
    fields:
      name: { from: "Name" }
      height_m: { from: "Height (m)", unit: m }
      diameter_m: { from: "Diameter (m)", unit: m }
      liftoff_mass_kg: { from: "Liftoff Mass (t)", unit: t }     # cot nguon tinh bang tan -> kg
      stage_count: { from: "Stages" }
      propulsion: { from: "Propulsion" }
      fuel: { from: "Fuel" }
      leo_capacity_kg: { from: "LEO Capacity (kg)", unit: kg }
      cost_musd: { from: "Cost (M$)", unit: MUSD }
      compatible_site_ids: { from: "Compatible Sites", split: ";" }

  - table: launch_sites
    source: { file: sample_library.json, sheet: Launch Sites }
    id: { from: "Site ID", expect_prefix: "SITE-" }
    fields:
      name: { from: "Name" }
      lat_deg: { from: "Latitude (deg)", unit: deg }
      lon_deg: { from: "Longitude (deg)", unit: deg }
