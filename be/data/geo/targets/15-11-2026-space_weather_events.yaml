# Cac "khung quan trac bao Mat Troi" ve tinh co the ghi lai cho nhiem vu MP-SC03-SPACE-WEATHER.
# Day la CAC LOAI HIEN TUONG co that cua vat ly khong gian (vanh dai buc xa Van Allen, di thuong Nam Dai Tay Duong,
# cuc quang, bao tu), nhung hinh anh trong game la MINH HOA do thuat toan ve (be/tools/15-11-2026-render_space_weather.py),
# KHONG phai du lieu do that. Vi tri cac dinh vanh dai (L) la gia tri dien hinh de minh hoa.
# instruments: thiet bi nao ghi duoc loai khung nay (may do tu INS-07 -> tu pho; may do hat INS-08 -> ban do hat).
set: space_weather
items:
  - { id: SW-MAG-SSC,   name: "Magnetometer: Storm Sudden Commencement (SSC)",  kind: magnetogram, instruments: [INS-07] }
  - { id: SW-MAG-MAIN,  name: "Magnetometer: Geomagnetic Storm Main Phase",     kind: magnetogram, instruments: [INS-07] }
  - { id: SW-MAG-REC,   name: "Magnetometer: Recovery Phase",                   kind: magnetogram, instruments: [INS-07] }
  - { id: SW-BELT-OUT,  name: "Outer Radiation Belt Compression",               kind: belt_map,    instruments: [INS-08] }
  - { id: SW-BELT-SLOT, name: "Slot Region Particle Infill",                    kind: belt_map,    instruments: [INS-08] }
  - { id: SW-SAA,       name: "South Atlantic Anomaly (SAA) Flux Map",          kind: saa_map,     instruments: [INS-08] }
  - { id: SW-AURORA-N,  name: "Northern Auroral Oval Expansion",                kind: aurora_map,  instruments: [INS-08] }
  - { id: SW-AURORA-S,  name: "Southern Auroral Oval Expansion",                kind: aurora_map,  instruments: [INS-08] }
