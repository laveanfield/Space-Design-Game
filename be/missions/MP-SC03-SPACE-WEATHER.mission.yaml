schema: mission-pack/1
id: MP-SC03-SPACE-WEATHER
extends: { table: scenarios, id: SC-03 }
meta:
  title: { vi: "Trạm gác thời tiết không gian", en: "Space Weather Sentinel" }
  brief: { vi: "Giữ máy đo từ hoạt động liên tục trong vành đai bức xạ.", en: "Keep a magnetometer sampling inside the radiation belts." }
  learning_goals: [ "radiation hardening" ]
  difficulty: 3
objective:
  statement: { vi: "Sống sót và lấy mẫu liên tục.", en: "Survive and sample continuously." }
constraints:
  - { id: radiation, critical: true }
gameplay: { mode: auto }
starter: fail_radiation
hazards: { profile: standard, seed: 7 }
presets:
  - id: good
    expect: pass
    design:
      orbit: ORB-MEO-20200
      instruments: [ INS-08 ]
      bus: BUS-ESPA
      power: PWR-SA-SMALL
      battery: BAT-L
      comm: COM-S-CUBE
      obc: OBC-RADHARD
      adcs: ADCS-WHEEL
      launch: { vehicle: LV-VEGAC, site: SITE-KOUROU }
  - id: fail_radiation
    from: good
    swap: { obc: OBC-SPACE }
    expect: "fail:radiation"
