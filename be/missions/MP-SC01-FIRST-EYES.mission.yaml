schema: mission-pack/1
id: MP-SC01-FIRST-EYES
extends: { table: scenarios, id: SC-01 }      # ke thua ngan sach, diem toi thieu, tuoi tho, han, quy dao cho phep
meta:
  title: { vi: "ĐÔI MẮT ĐẦU TIÊN NHÌN VỀ TRÁI ĐẤT", en: "The First Eyes Looking Back at Earth" }
  brief: { vi: "Mùa cháy rừng đang tới. Đưa một CubeSat lên quỹ đạo thấp, để nó tự chụp ảnh các đám cháy và gửi về làm bằng chứng cho cơ quan cứu hộ, trong ngân sách nhỏ.", en: "Wildfire season is coming. Put a CubeSat in low orbit that photographs wildfires on its own and sends the images down as evidence for responders, on a small budget." }
  learning_goals: [ "power budget", "data downlink" ]
  difficulty: 1
objective:
  statement: { vi: "Vệ tinh tự động chụp ảnh đám cháy rừng; có đủ 3 ảnh rõ nét về tới trạm mặt đất là nhiệm vụ được công nhận.", en: "The satellite photographs wildfires automatically; 3 clear images delivered to the ground station complete the mission." }
design_space:
  allow: { instruments: { tier: [ basic ] } }
constraints:
  - { id: data, critical: true }
starter: fail_data
gameplay: { mode: auto, params: { target_set: coast, evidence_set: wildfire } }
hazards: { profile: standard, seed: 42 }
presets:
  - id: good
    expect: pass
    design:
      orbit: ORB-LEO-400
      instruments: [ INS-01 ]
      bus: BUS-3U
      power: PWR-SA-DEP
      battery: BAT-S
      comm: COM-S-CUBE
      obc: OBC-CUBE
      adcs: ADCS-WHEEL
      launch: { vehicle: LV-ELECTRON, site: SITE-MAHIA }
  - id: fail_data
    from: good
    swap: { comm: COM-UHF }
    expect: "fail:data"
  - id: fail_power
    from: good
    swap: { power: PWR-SA-BODY }
    expect: "fail:power"
  - id: fail_pointing
    from: good
    swap: { adcs: ADCS-MAG }
    expect: "fault:blur"
